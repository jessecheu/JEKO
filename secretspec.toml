#:schema https://secretspec.dev/schema/secretspec.schema.json

[project]
name = "jeko"
revision = "1.0"

[profiles.default]
CEREBRAS_API_KEY = { description = "Cerebras API key for live Kimi K3.1 task generation; game runs fully offline on assets/tasks_fallback.json if unset", required = false }
CEREBRAS_MODEL = { description = "Cerebras model slug for Kimi K3.1", default = "kimi-k3.1" }
CEREBRAS_BASE_URL = { description = "Cerebras OpenAI-compatible chat-completions base URL", default = "https://api.cerebras.ai/v1" }
